[project]
name = "smart-process-system"
version = "0.1.0"
description = "AI-assisted 2D drawing process planning system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "flask>=3.1,<4",
  "flask-cors>=6,<7",
  "werkzeug>=3.1,<4",
  "python-dotenv>=1.1,<2",
  "pymupdf>=1.26,<2",
  "pdf2image>=1.17,<2",
  "pillow>=11,<13",
  "pyjwt>=2.8,<3",
  "opencv-python>=4.11,<5",
  "ezdxf>=1.4,<2",
  "ezdwg>=0.9,<1",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "rapidocr-onnxruntime>=1.4,<2",
  "onnxruntime>=1.22,<2",
  "langchain-openai>=1.0,<2",
  "langchain-core>=1.0,<2",
  "openai>=2,<3",
  "requests>=2.32,<3",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
yolo = [
  "ultralytics>=8.3,<9",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
]
windows-creo = [
  "pywinauto>=0.6.9,<1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "python-docx>=1.2,<2",
]

[tool.uv]
package = false
default-groups = []

[tool.pytest.ini_options]
testpaths = ["backend"]
python_files = ["test_*.py"]
addopts = "-ra"
